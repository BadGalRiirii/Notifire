name: notifire
description: Solar-Powered IoT-Based Smoke and Fire Detection System — mobile app.
publish_to: "none"
# Bump BOTH numbers for every release you hand out (name+code); Android only
# installs an update whose code (after +) is higher than the installed one.
version: 1.4.0+8

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_reactive_ble: ^5.6.0
  flutter_secure_storage: ^11.2.0
  http: ^1.2.0
  intl: ^0.19.0
  mobile_scanner: ^7.4.2
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
